<div class="login-page">

  <div class="decoration decoration-one"></div>

  <div class="decoration decoration-two"></div>

  <section class="login-card">

    <div class="brand">

      <div class="logo">
        ☕
      </div>

      <h1>
        CoffeeFlow
      </h1>

      <p>
        Gestión simple para tu cafetería
      </p>

    </div>


    <form
      [formGroup]="form"
      (ngSubmit)="ingresar()"
    >

      <div class="form-group">

        <label for="usuario">
          Usuario
        </label>

        <div class="input-container">

          <span class="input-icon">
            👤
          </span>

          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            placeholder="Ingresa tu usuario"
          >

        </div>

      </div>


      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <div class="input-container">

          <span class="input-icon">
            🔒
          </span>

          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
          >

        </div>

      </div>


      @if (error) {

        <div class="login-error">
          {{ error }}
        </div>

      }


      <button
        class="login-button"
        type="submit"
      >
        Iniciar sesión
      </button>

    </form>


    <div class="demo">

      <span>
        Usuario demo
      </span>

      <strong>
        admin / 1234
      </strong>

    </div>

  </section>

</div>
