# Configuracion del analisis SonarQube - CoffeeFlow
sonar.projectKey=coffeeflow
sonar.projectName=CoffeeFlow
sonar.projectVersion=2.0

# Codigo del sistema web: frontend Angular (TypeScript/HTML/SCSS) y backend Spring Boot
sonar.sources=front/src,coffe/src/main/java
sonar.java.binaries=coffe/target/classes
sonar.sourceEncoding=UTF-8

# Codigo de pruebas: unitarias/integracion (Vitest) y automatizadas (JUnit 5 + Selenium)
sonar.tests=front/src,pruebas-selenium/src/test/java
sonar.test.inclusions=front/src/**/*.spec.ts,front/src/test-setup.ts,front/src/testing/**,pruebas-selenium/src/test/java/**
sonar.java.test.binaries=pruebas-selenium/target/test-classes
sonar.java.test.libraries=pruebas-selenium/target/dependency/*.jar

sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/*.spec.ts,front/src/test-setup.ts,front/src/testing/**

# Cobertura de "ng test --coverage". ejecutar-sonarqube.ps1 genera lcov-sonar.info con rutas
# relativas a la raiz del repositorio (el lcov original es relativo a la carpeta front).
sonar.javascript.lcov.reportPaths=front/coverage/front/lcov-sonar.info
