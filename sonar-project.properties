# Configuracion del analisis SonarQube - CoffeeFlow
sonar.projectKey=coffeeflow
sonar.projectName=CoffeeFlow
sonar.projectVersion=1.0

# Codigo del sistema web: frontend Angular (TypeScript/HTML/SCSS) y backend Spring Boot
sonar.sources=front/src,coffe/src/main/java
sonar.java.binaries=coffe/target/classes
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/*.spec.ts

# Cobertura: si se generan pruebas unitarias del front con "ng test --coverage"
sonar.javascript.lcov.reportPaths=front/coverage/front/lcov.info
